name: Happo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two Happo projects: the Storybook components (happo.config.ts) and the
# Playwright end-to-end tests (happo.e2e.config.ts). Each posts its own status.
jobs:
  happo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the PR's own commit, not the merge commit GitHub creates.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Happo compares against the merge base with origin/main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm happo
        env:
          HAPPO_API_KEY: ${{ secrets.HAPPO_API_KEY }}
          HAPPO_API_SECRET: ${{ secrets.HAPPO_API_SECRET }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm happo:e2e
        env:
          HAPPO_API_KEY: ${{ secrets.HAPPO_API_KEY }}
          HAPPO_API_SECRET: ${{ secrets.HAPPO_API_SECRET }}
